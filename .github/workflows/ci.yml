name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # NEXT_PUBLIC_* values reach the browser bundle, so they are not secrets.
      # They default to the live project and can be overridden with repository
      # variables (Settings > Secrets and variables > Actions > Variables).
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID || '7kuc1z13' }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET || 'production' }}
      NEXT_PUBLIC_SANITY_API_VERSION: ${{ vars.NEXT_PUBLIC_SANITY_API_VERSION || '2026-05-12' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Not blocking yet: the branch inherited 104 eslint errors, almost all
      # no-explicit-any in pre-existing files. Clearing those is its own piece of
      # work, and silencing the rule to get a green tick would defeat the point.
      # Make this blocking once the count reaches zero.
      - name: Lint (report only)
        run: npm run lint
        continue-on-error: true

      # Builds before the tests because the schema tests assert against the
      # rendered HTML in .next, not against the helper return values.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Redirect map invariants
        run: npx tsx scripts/check-redirects.mts

      # Starts the production server against the build above and checks status
      # codes, canonicals, redirect hops, duplicate metadata, JSON-LD and the
      # identical-lastmod condition.
      - name: SEO check
        run: npm run seo:check
